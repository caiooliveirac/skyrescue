name: Deploy

# Deploy no servidor magalu sem SSH e sem runner no Mac:
#
#   1. aqui, na VM do GitHub: testes de unidade + build + smoke do bundle;
#   2. verde: move a branch `live` para esse SHA (só avança, fast-forward);
#   3. no servidor: o auto-promote.timer (a cada minuto) vê a `live` andar e
#      roda `labctl promote skyrescue <sha>` → scripts/deploy-magalu.sh do
#      próprio commit (build do front num checkout à parte, backend com
#      migrate idempotente, front em /var/www/goa, health e rollback);
#   4. aqui: espera https://goa.mnrs.com.br/versao.txt mostrar esse SHA.
#
# Funciona de qualquer aparelho: merge/push na main pelo celular basta.

on:
  push:
    branches: [main]
  # Revalida e libera a ponta da main de novo (ex.: a `live` não andou).
  workflow_dispatch:

concurrency:
  group: skyrescue-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Testes de unidade (fusão da ficha)
        run: node server/scripts/test-patient-merge.js

      - name: Testes de unidade (acionamento público, limite e IP)
        run: node server/scripts/test-acionamento-publico.js

      - name: Testes de unidade (estatísticas)
        run: node scripts/test-stats.js

      - name: Testes de unidade (registro da equipe)
        run: node scripts/test-crew.js

      - name: Build (arquivo único)
        env:
          # opcional: embute a chave Google Maps p/ todos os usuários do site
          # (o build de produção, no servidor, lê a mesma chave do .env.production de lá)
          VITE_GMAPS_KEY: ${{ secrets.VITE_GMAPS_KEY }}
        run: npm run build

      - name: Smoke test do bundle
        run: |
          test -f dist/index.html
          test -f dist/sw.js                          # service worker (app abre sem rede)
          grep -q "SkyRescue" dist/index.html
          grep -q "Hospital do Sub" dist/index.html   # dados de hospitais embutidos
          size=$(wc -c < dist/index.html)
          if [ "$size" -lt 100000 ]; then
            echo "ERRO: bundle suspeito de estar incompleto ($size bytes)"
            exit 1
          fi
          echo "bundle OK ($size bytes)"

      - name: Script de deploy (sintaxe)
        run: bash -n scripts/deploy-magalu.sh

  liberar:
    name: Liberar para o LIVE (branch live)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      # Pela API: o GitHub confere o fast-forward do lado dele (re-run de um
      # run antigo não faz a live voltar; rollback é revert na main).
      - name: Mover a live para o SHA testado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/live" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/live" \
              -f sha="${GITHUB_SHA}" -F force=false >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/heads/live -f sha="${GITHUB_SHA}" >/dev/null
          fi
          echo "live -> ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  aguardar:
    name: Esperar o servidor publicar
    needs: liberar
    runs-on: ubuntu-latest
    # Timer de 1 min + build (~1–2 min) + fila de outros apps no auto-promote.
    timeout-minutes: 25
    steps:
      # O deploy-magalu.sh grava versao.txt só depois de backend e front
      # saudáveis e do git do servidor alinhado.
      - name: versao.txt público com o SHA novo
        run: |
          set -u
          url=https://goa.mnrs.com.br/versao.txt
          while true; do
            no_ar="$(curl -fsS -m 10 "${url}?t=$(date +%s)" 2>/dev/null | head -c 64 | tr -d '[:space:]' || true)"
            if [ "${no_ar}" = "${GITHUB_SHA}" ]; then
              echo "No ar: ${no_ar}"
              break
            fi
            echo "Ainda em ${no_ar:0:7}; esperando ${GITHUB_SHA:0:7}..."
            sleep 20
          done

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy goa.mnrs.com.br (magalu, auto-promote)"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Público: https://goa.mnrs.com.br/versao.txt"
            echo "- Se não publicou: \`ssh magalu journalctl -u auto-promote -n 80\` e \`labctl history skyrescue\`"
          } >> "$GITHUB_STEP_SUMMARY"
